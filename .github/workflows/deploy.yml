name: Build and Deploy

on:
  push:
    branches:
      - express

jobs:
  build:
    name: build and push docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build docker image
        run: |
          docker build \
            -f "Dockerfile" \
            -t  ${{ secrets.DOCKERHUB_USERNAME }}/web-repo:latest \
            .

      - name: Push image
        run: | 
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/web-repo:latest

  deploy:
    name: deploy to the target server
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: deploy
        uses: appleboy/ssh-action@v1
        with:
          
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: | 
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/web-repo:latest

            docker stop express-api || true
            docker rm express-api || true

            docker run -d \
              --name express-api \
              --restart unless-stopped \
              -p 81:3000 \
              ${{ secrets.DOCKERHUB_USERNAME }}/web-repo:latest